server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads: up to 10 PDFs of 50 MB each in one request.
    client_max_body_size 512m;

    # The API, and its interactive documentation.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Answers, summaries, comparisons and gap analyses wait on the LLM.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Built assets have content hashes in their names, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/papers, /assistant, ...): always serve the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
