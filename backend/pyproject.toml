[project]
name = "researchmate-backend"
version = "0.1.0"
description = "ResearchMate API: research paper analysis with hybrid RAG"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "models: downloads a Hugging Face model on first run (cached afterwards); deselect with -m 'not models'",
    "llm: calls the real Gemini API; skipped unless GEMINI_API_KEY is configured",
]
filterwarnings = [
    # Starlette now prefers the httpx2 fork for its TestClient; httpx still works
    # and is the project's chosen HTTP test client.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
